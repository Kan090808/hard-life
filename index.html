<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eef1" />
    <meta name="description" content="一天三個決定，在月底前撐過工作、房租和生活。" />
    <title>打工人生：月底前活下去</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" id="game-shell">
      <header class="topbar">
        <div>
          <p class="day-label" id="day-label">Day 1 / 21</p>
          <div class="period-heading">
            <h1 id="period-label">早上</h1>
            <div class="period-progress" id="period-progress" aria-label="今天進度"></div>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="rent-button" id="rent-button" type="button" data-info="rent" aria-label="查看房租資訊">
            <span class="icon-slot" data-icon="home" aria-hidden="true"></span>
            <span id="rent-label">6 天</span>
          </button>
          <button class="icon-button" id="utility-button" type="button" aria-label="開啟設定">
            <span class="icon-slot" data-icon="menu" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <section class="status-bar" id="status-bar" aria-label="目前狀態">
        <button class="status-item status-money" type="button" data-info="money">
          <span class="icon-slot" data-icon="wallet" aria-hidden="true"></span>
          <strong id="money-value">$0</strong>
          <span class="sr-only">查看金錢說明</span>
        </button>
        <button class="status-item status-energy" type="button" data-info="energy">
          <span class="icon-slot" data-icon="bolt" aria-hidden="true"></span>
          <strong id="energy-value">0</strong>
          <span class="sr-only">查看體力說明</span>
        </button>
        <button class="status-item status-stress" type="button" data-info="stress">
          <span class="icon-slot" data-icon="pulse" aria-hidden="true"></span>
          <strong id="stress-value">0</strong>
          <span class="sr-only">查看壓力說明</span>
        </button>
        <button class="status-item status-skill" type="button" data-info="skill">
          <span class="icon-slot" data-icon="spark" aria-hidden="true"></span>
          <strong id="skill-value">0</strong>
          <span class="sr-only">查看技能說明</span>
        </button>
        <button class="status-item status-luck" type="button" data-info="luck">
          <span class="icon-slot" data-icon="clover" aria-hidden="true"></span>
          <strong id="luck-value">50</strong>
          <span class="sr-only">查看運氣說明</span>
        </button>
      </section>

      <section class="context-strip" id="context-strip" aria-label="特質與持續狀態"></section>

      <section class="situation-panel" id="situation-panel" aria-live="polite">
        <p class="situation-kicker" id="situation-kicker">早上 · Day 1</p>
        <h2 id="situation-title">新的一天</h2>
        <p class="situation-body" id="situation-body">今天先把哪件事做好？</p>
        <div class="result-deltas hidden" id="result-deltas"></div>
        <ul class="result-notes hidden" id="result-notes"></ul>
      </section>

      <section class="decision-area" aria-label="目前可以做的事">
        <div class="action-list" id="action-list"></div>
        <button class="continue-button hidden" id="continue-button" type="button">繼續</button>
      </section>
    </main>

    <section class="full-screen intro-screen" id="intro-screen" aria-labelledby="intro-title">
      <div class="intro-mark" aria-hidden="true"><span class="icon-slot" data-icon="wallet"></span></div>
      <h2 id="intro-title">人生好難</h2>
      <p>在艱難的生活中存活 21 天。</p>
      <button class="primary-button" id="start-button" type="button">開始這個月</button>
      <small id="app-version"></small>
    </section>

    <section class="full-screen ending-screen hidden" id="ending-screen" aria-labelledby="ending-title">
      <div class="ending-content" id="ending-capture">
        <div class="ending-header">
          <p class="ending-eyebrow" id="ending-eyebrow">月底結算</p>
          <button class="icon-button ending-catalog-btn" id="ending-catalog-btn" type="button" aria-label="結局圖鑑">?</button>
        </div>
        <h2 id="ending-title">這個月結束了</h2>
        <p id="ending-body"></p>
        <div class="ending-stats" id="ending-stats"></div>
        <div class="ending-tags" id="ending-tags"></div>
      </div>
      <div class="ending-actions">
        <button class="primary-button" id="restart-button" type="button">再活一次</button>
        <button class="secondary-button" id="copy-result-button" type="button">複製結果</button>
      </div>
    </section>

    <section class="full-screen ending-catalog-overlay hidden" id="ending-catalog" aria-label="結局圖鑑">
      <div class="ending-catalog-head">
        <h2>結局圖鑑</h2>
        <button class="icon-button" id="ending-catalog-close" type="button" aria-label="關閉圖鑑">
          <span class="icon-slot" data-icon="close"></span>
        </button>
      </div>
      <div class="ending-catalog-progress">
        <span id="ending-progress">0 / 10</span>
      </div>
      <p>所有條件都已公開。挑一個目標，再活一次。</p>
      <div class="ending-goal-list" id="ending-goal-list"></div>
    </section>

    <div class="sheet-backdrop hidden" id="sheet-backdrop"></div>
    <section class="bottom-sheet hidden" id="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <div class="sheet-icon icon-slot" id="sheet-icon" aria-hidden="true"></div>
        <div>
          <p id="sheet-value"></p>
          <h2 id="sheet-title">說明</h2>
        </div>
        <button class="icon-button" id="sheet-close-button" type="button" aria-label="關閉說明">
          <span class="icon-slot" data-icon="close" aria-hidden="true"></span>
        </button>
      </div>
      <p class="sheet-copy" id="sheet-copy"></p>
      <div class="sheet-actions hidden" id="sheet-actions"></div>
    </section>

    <script type="module" src="./src/main.mjs"></script>
  </body>
</html>
